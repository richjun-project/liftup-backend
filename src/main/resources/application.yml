spring:
  application:
    name: liftupai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL
    time-zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

app:
  exercise-catalog:
    mode: ${APP_EXERCISE_CATALOG_MODE:if_empty}
    resource: ${APP_EXERCISE_CATALOG_RESOURCE:catalog/exercise-catalog.json}
    exit-after-bootstrap: ${APP_EXERCISE_CATALOG_EXIT_AFTER_BOOTSTRAP:false}
  exercise-media:
    base-url: ${APP_EXERCISE_MEDIA_BASE_URL:https://dearglobe.s3.ap-northeast-2.amazonaws.com/liftupai}
    # 운동별 썸네일·영상 보유 현황(없으면 모든 운동에 미디어가 있다고 본다)
    manifest: catalog/exercise-media.json
  # 검색 운영 로그(질의·결과 수·지연·로케일; 사용자 식별자 없음) — 0건 질의 집계는 scripts/ops/search_zero_results.sql
  search-ops:
    enabled: true
    retention-days: 30
    flush-interval-ms: 5000

# Firebase FCM 설정
firebase:
  enabled: ${FIREBASE_ENABLED:true}
  config:
    path: ${FIREBASE_CONFIG_PATH:firebase-service-account.json}

# JWT 설정
jwt:
  # 기본값 없음 — JWT_SECRET 미설정 시 부팅 실패가 정상 (repo에 노출된 폴백 시크릿으로 서명되는 사고 방지)
  # 로컬 개발용 기본값은 application-local.yml에만 존재
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000  # 1시간
  refresh-token-expiration: 2592000000  # 30일

# Google Gemini API 설정
gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-flash-latest
  plan-model: gemini-pro-latest
  max-tokens: 2048
  plan-max-tokens: 16384
  temperature: 0.7
  plan-temperature: 0.4

# 운동 검색 — 의미(임베딩) 검색 보강. 기본은 꺼짐(어휘 검색만), prod·local 프로파일에서 켠다.
# 질의 임베딩이 실패하면(시간 초과·차단기·키 문제) 조용히 어휘 검색만으로 동작한다. 키는 위 gemini.api-key 를 그대로 쓴다.
search:
  semantic:
    enabled: ${SEMANTIC_SEARCH_ENABLED:false}
    timeout-ms: 1200
    cache-size: 2048
    breaker-failures: 5
    breaker-open-ms: 30000
    negative-cache-ms: 600000
  # LLM 질의 해석 — 자연어 질의를 트레이너식 영어 운동 이름 힌트·제외 장비로 바꿔 하이브리드 결과에 섞는다(의미 검색이 켜져 있을 때만 쓰인다).
  # 실패·시간 초과·차단기 열림이면 하이브리드 결과 그대로. 기본은 꺼짐, prod·local 프로파일에서 켠다.
  rewrite:
    enabled: ${QUERY_REWRITE_ENABLED:false}
    model: ${QUERY_REWRITE_MODEL:gemini-flash-lite-latest}
    timeout-ms: 2500
    cache-size: 4096
    breaker-failures: 5
    breaker-open-ms: 30000
    negative-cache-ms: 600000

  # 검색 쪽 Gemini 호출(임베딩+해석) 전역 관문 — 채팅·플랜 생성과 같은 키/쿼터를 쓰므로 검색이 그것을 굶기지 않게 한다.
  # 분당·일일 예산을 넘으면 호출하지 않고 어휘(하이브리드) 결과로 간다. Gemini 를 기다리는 자연어 검색이 상한을 넘으면 기다리지 않고 바로 건너뛴다.
  # 요약 로그(호출 수·실패 분류·건너뜀·캐시 적중·p50/p95)는 summary-interval-ms 마다 INFO 한 줄.
  # 검색 전용 키: 환경변수 SEARCH_LLM_API_KEY(= search.llm.api-key)를 주면 채팅·플랜과 쿼터를 분리한다. 비워 두려면 아예 정의하지 않는다(정의하면 빈 값도 우선한다).
  llm:
    budget-per-minute: ${SEARCH_LLM_CALLS_PER_MINUTE:90}
    daily-cap: ${SEARCH_LLM_DAILY_CAP:20000}
    max-concurrent-searches: ${SEARCH_LLM_MAX_CONCURRENT:20}
    summary-interval-ms: 300000

# OAuth2 소셜 로그인 설정
oauth:
  google:
    client-id: ${OAUTH_GOOGLE_CLIENT_ID:NOT_SET}
  apple:
    client-id: ${OAUTH_APPLE_CLIENT_ID:NOT_SET}
  kakao:
    rest-api-key: ${OAUTH_KAKAO_REST_API_KEY:NOT_SET}

# Rate Limiting 설정
rate-limit:
  chat:
    per-minute: 10
    per-hour: 60
    per-day: 300
  # 운동 검색·제안·추천·대체 운동: 사용자별 분당 요청 수 (초과 시 429 + Retry-After)
  search:
    per-minute: 120

# RevenueCat 설정
revenuecat:
  webhook-secret: ${REVENUECAT_WEBHOOK_SECRET:}

# AWS S3 설정
cloud:
  aws:
    s3:
      bucket: dearglobe
      folder: liftupai/
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
