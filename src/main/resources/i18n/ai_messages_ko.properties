# 안전 폴백 — 모델 응답이 하드 규칙을 두 번 위반했을 때만 사용 (ChatSafetyService)
safety.fallback.red_flag={0}님, 말씀하신 증상(가슴 통증·실신·호흡곤란 등)은 운동이 아니라 진료가 먼저예요. 지금 바로 운동을 멈추고 119 또는 병원에 연락해 주세요. 괜찮아지면 언제든 다시 도와드릴게요.
safety.fallback.eating={0}님, 식사를 더 줄이는 건 도와드릴 수 없어요. 굶거나 토하거나 극단적으로 적게 먹는 건 몸을 크게 해칠 수 있어요. 의사나 상담사, 믿을 만한 사람에게 꼭 이야기해 주세요. 더 튼튼해지고 충분히 먹는 쪽은 얼마든지 도와드릴게요.
safety.fallback.minor_underweight={0}님, 지금 나이나 체중에서는 감량이나 칼로리 줄이기를 안내하지 않아요. 성장과 회복에 충분한 영양이 먼저거든요. 대신 근력·체력·기술을 키우는 쪽으로 가요. 체중 목표는 부모님이나 의사 선생님과 함께 정해 주세요.
safety.fallback.injury={0}님, {1} 부상이 등록돼 있어서 {1}에 부하가 가는 동작은 지금 권하지 않아요. 대신 {2} 위주로 진행해 보세요. 통증이 계속되면 병원이나 물리치료사에게 먼저 확인받고, 하려던 동작을 알려주시면 안전한 대체 운동을 골라드릴게요.
