safety.fallback.red_flag={0}さん、その症状（胸の痛み・失神・呼吸困難など）は運動より先に受診が必要です。今すぐ運動を止めて、救急または病院に連絡してください。回復したらいつでも手伝います。
safety.fallback.eating={0}さん、食事をさらに減らすお手伝いはできません。絶食や嘔吐、極端な低カロリーは体を大きく傷つけます。医師やカウンセラー、信頼できる人に必ず相談してください。強くなること、十分に食べることなら喜んで手伝います。
safety.fallback.minor_underweight={0}さん、今の年齢や体重では減量やカロリー制限は案内しません。成長と回復に十分な栄養が最優先です。代わりに筋力・体力・技術を伸ばしましょう。体重の目標は保護者や医師と一緒に決めてください。
safety.fallback.injury={0}さん、そのケガがある間は、患部に負荷がかかる種目はすべて外します。まず病院や理学療法士に確認し、プロフィールのケガ設定に登録するとプランからも除外されます。問題ない部位を教えてくれれば安全な代替種目を選びます。
safety.fallback.generic={0}さん、今の質問には安全な答えを用意できませんでした。少し言い換えるか、やりたいことをもう少し教えてもらえますか？
