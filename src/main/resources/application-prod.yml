# Production 환경 설정
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:liftupai}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

# 의미(임베딩) 검색 — 운영 서버 IP 에서만 Gemini 키가 동작한다. 끄려면 SEMANTIC_SEARCH_ENABLED=false
search:
  semantic:
    enabled: ${SEMANTIC_SEARCH_ENABLED:true}

# Qdrant (production)
qdrant:
  host: ${QDRANT_HOST}
  port: ${QDRANT_PORT:6334}

# 파일 업로드 (S3 사용)
upload:
  use-s3: true

logging:
  level:
    root: WARN
    com.richjun.liftupai: INFO
