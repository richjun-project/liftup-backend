services:
  mysql:
    image: mysql:8.0
    container_name: liftupai-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: liftupai_db
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_CHARACTER_SET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - liftupai-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: liftupai-qdrant-prod
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_prod_data:/qdrant/storage
    networks:
      - liftupai-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liftupai-app-prod
    ports:
      - "127.0.0.1:8081:8081"  # 외부는 Caddy(443)로만 — 앱 포트를 인터넷에 직접 열지 않는다
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/liftupai_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: false
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "20260316001"
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET}
    volumes:
      - ./uploads:/app/uploads
      # 컨테이너 재생성(배포)에도 로그가 남도록 호스트에 보존 — logback-spring.xml 참고
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - liftupai-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  mysql_prod_data:
    driver: local
  qdrant_prod_data:
    driver: local

networks:
  liftupai-network:
    driver: bridge
